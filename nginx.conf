# Author: Madhusudan Kharote - SWE645 Homework 2
# Purpose: Nginx site configuration that serves the static survey site and
# returns the branded error.html page for missing URLs.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Branded 404 page from HW1
    error_page 404 /error.html;

    # Simple endpoint used by Kubernetes liveness/readiness probes
    location /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
